<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechGear E-Commerce Capstone</title>
    <!-- Link to our optimized CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Modular Navigation -->
    <nav class="navbar">
        <div class="logo">TechGear.</div>
        <ul class="nav-links">
            <!-- Notice the hash (#) in the href. This is for client-side routing -->
            <li><a href="#/">Catalog</a></li>
            <li><a href="#/cart">Cart (<span id="cart-count">0</span>)</a></li>
            <li><a href="#/about">About Us</a></li>
            <li><a href="#/contact">Contact Us</a></li>
        </ul>
    </nav>

    <!-- The DOM element where our views will be dynamically injected -->
    <main id="app-root" class="container"></main>

    <!-- Link to our application logic -->
    <script src="app.js"></script>
</body>
</html>
