<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TechGear is a student front-end e-commerce demonstration built with HTML, CSS and JavaScript.">
  <title>TechGear | Everyday Tech, Made Simple</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="navbar" aria-label="Main navigation">
      <a class="logo" href="#/" aria-label="TechGear home"><span class="logo-mark">T</span><span>techgear<span class="logo-dot">.</span><small>EVERYDAY TECH, MADE SIMPLE</small></span></a>
      <div class="nav-links">
        <a href="#/" data-nav="catalog">Shop</a>
        <a href="#/about" data-nav="about">About</a>
        <a href="#/contact" data-nav="contact">Contact</a>
        <a class="cart-link" href="#/cart" data-nav="cart"><span aria-hidden="true">▢</span> Cart <span id="cart-count" class="cart-count">0</span></a>
      </div>
    </nav>
  </header>

  <main id="app-root" class="container" tabindex="-1"></main>

  <footer class="site-footer">
    <div><a class="footer-brand" href="#/">techgear<span>.</span></a><p>A simple electronics storefront demonstration.</p></div>
    <div class="footer-links"><a href="#/about">About Us</a><a href="#/contact">Contact</a><a href="#/cart">Your Cart</a></div>
    <p class="footer-note">Student project · No real payments or orders</p>
  </footer>

  <dialog id="product-dialog" class="product-dialog" aria-labelledby="dialog-title">
    <form method="dialog"><button class="dialog-close" aria-label="Close product details">×</button></form>
    <div id="dialog-content"></div>
  </dialog>
</body>
</html>
